services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      RAG_VECTOR_STORE: chroma
      RAG_CHROMA_URL: http://chroma:8000
    depends_on:
      chroma:
        condition: service_started

  chroma:
    image: chromadb/chroma:0.5.20
    volumes: ["chroma_data:/chroma/chroma"]
    ports: ["8001:8000"]

volumes:
  chroma_data:
